<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Room</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <h1>Ops Room</h1>
  <nav class="topbar-actions">
    <button id="refresh-btn" type="button">Refresh</button>
    <span id="refreshing-indicator" class="hidden">Refreshing...</span>
    <span id="last-updated"></span>
  </nav>
</header>

<main class="dashboard">
  <section id="health-section" class="section">
    <h2>System Health</h2>
    <div id="health-content">
      <p class="loading">Loading health...</p>
    </div>
  </section>

  <section id="instances-section" class="section">
    <h2>OpenAB Instances</h2>
    <div id="instances-content">
      <p class="loading">Loading instances...</p>
    </div>
  </section>
</main>

<div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <div class="modal-heading">
        <h2 id="modal-title">Details</h2>
        <p id="modal-subtitle" class="modal-subtitle"></p>
      </div>
      <button id="modal-close" class="modal-close" type="button" aria-label="Close dialog">Close</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </section>
</div>

<script src="/app.js"></script>
</body>
</html>
