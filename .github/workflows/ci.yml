name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.19.0']
    defaults:
      run:
        working-directory: ops-room
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ops-room/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Build dashboard
        run: npm run build:dashboard

  smoke:
    name: OpenAB instances smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops-room
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: ops-room/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build dashboard
        run: npm run build:dashboard

      - name: Start Ops Room and smoke test instances
        env:
          OPENAB_WEBHOOK_SECRET: ci-smoke-secret
          OPENAB_WEBHOOK_PORT: '17380'
        run: |
          node src/server/webhook.mjs > /tmp/ops-room-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:17380/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:17380/health > /dev/null
          npm run smoke:instances
