name: Capture OPS-002 test output

on:
  push:
    branches: [feat/audited-task-cancellation]
    paths:
      - ops-room/debug-ops002-trigger.txt

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/audited-task-cancellation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: ops-room/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ops-room
      - name: Capture tests
        working-directory: ops-room
        run: |
          set +e
          npm test > ops002-test-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> ops002-test-output.txt
          exit 0
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-room/ops002-test-output.txt
          git commit -m "chore: capture OPS-002 test output"
          git push origin HEAD:feat/audited-task-cancellation
