name: Capture OPS-003 failures

on:
  push:
    branches: [feat/agent-profile-foundation]
    paths: [ops-room/debug-ops003-trigger.txt]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/agent-profile-foundation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: ops-room/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ops-room
      - name: Capture tests and smoke
        working-directory: ops-room
        run: |
          set +e
          npm test > ops003-test-output.txt 2>&1
          echo "test_exit=$?" >> ops003-test-output.txt
          npm run smoke:instances > ops003-smoke-output.txt 2>&1
          echo "smoke_exit=$?" >> ops003-smoke-output.txt
          exit 0
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-room/ops003-*-output.txt
          git commit -m "chore: capture OPS-003 output"
          git push origin HEAD:feat/agent-profile-foundation
